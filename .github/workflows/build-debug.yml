name: Build Debug APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm


      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build debug + lock APK
        run: |
          chmod +x gradlew
          ./gradlew assembleLock --no-daemon

      - name: Push APK to server
        run: |
          curl -s --connect-timeout 30 --max-time 600 --retry 3 --retry-delay 10 -X POST -H "Authorization: Bearer ${{ secrets.APK_UPLOAD_TOKEN }}" --data-binary @app/build/outputs/apk/lock/app-arm64-v8a-lock.apk http://120.76.178.0:8080/lock.apk | head -c 100 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/lock/*.apk
